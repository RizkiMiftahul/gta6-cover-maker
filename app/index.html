<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Panels — Poster Cover Maker</title><link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="shell">
  <aside class="sidebar">
    <header class="brand"><div class="brand-mark">VP</div><div><h1>Vice Panels</h1><p>POSTER COVER STUDIO</p></div></header>
    <section class="control-section"><div class="section-heading"><h2>Your photos</h2><label class="upload-button" for="photoUpload">＋ Add photos</label><input id="photoUpload" type="file" accept="image/*" multiple></div><p class="hint">Drop photos onto a panel or click a thumbnail, then choose a panel.</p><div id="thumbnails" class="thumbnails"></div></section>
    <section class="control-section"><h2>Layout</h2><div id="layouts" class="layout-grid"></div></section>
    <section class="control-section"><h2>Overall grade</h2><div id="grades" class="grade-grid"></div></section>
    <section class="control-section"><h2>Selected panel <span id="panelName" class="muted">—</span></h2><label class="range-label">Zoom <output id="zoomValue">1.0×</output><input id="zoom" type="range" min="1" max="2.5" value="1" step="0.01"></label><label>Panel grade<select id="panelGrade"></select></label></section>
    <section class="control-section lettering"><h2>Lettering</h2><label>Title<input id="titleInput" maxlength="36" value="SUNSET HEIST"></label><label>Subtitle bar<input id="subtitleInput" maxlength="36" value="VICE CITY • EST. 2026"></label><label>Tagline<input id="taglineInput" maxlength="48" value="NO RULES AFTER DARK"></label></section>
    <section class="control-section finish"><h2>Finish</h2><label class="check"><input id="texture" type="checkbox" checked> Halftone, grain & vignette</label></section>
    <section class="control-section export-section"><h2>Export PNG</h2><div class="export-grid"><button data-size="1080x1080">Square <small>1080 × 1080</small></button><button data-size="1080x1350">Portrait <small>1080 × 1350</small></button><button data-size="1920x1080">Landscape <small>1920 × 1080</small></button></div><p id="status" role="status">Ready to create.</p></section>
  </aside>
  <section class="workspace"><div class="canvas-top"><span><i></i> LIVE PREVIEW</span><span id="canvasDimensions">1080 × 1080</span></div><div class="canvas-wrap"><canvas id="cover" width="1080" height="1080" aria-label="Poster cover preview"></canvas></div><p class="workspace-tip">Select a panel to adjust it · drag a photo to reposition</p></section>
</main><script type="module" src="./src/main.js"></script>
</body></html>
